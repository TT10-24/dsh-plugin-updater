name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法。请先说明你想解决什么问题，再描述你希望它怎么工作。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 例如“每次更新多个插件时，我看不到当前在装哪一个”。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案（可选）
  - type: textarea
    id: scope
    attributes:
      label: 影响范围（可选）
      description: 是否涉及 Host、客户端面板、桌面端路由、文档或 Pages？
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过已有 Issue，没有发现重复。
          required: true
