<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 — dsh-plugin-updater</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script>
    (function () {
      try {
        var param = new URLSearchParams(location.search).get('theme');
        var stored = localStorage.getItem('dsh-updater-theme');
        var theme = (param === 'light' || param === 'dark')
          ? param
          : (stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
        document.documentElement.dataset.theme = theme;
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <main class="hero" style="min-height:100vh;display:grid;place-items:center;text-align:center">
    <div>
      <p class="eyebrow"><span class="pulse"></span> 404</p>
      <h1>这个页面不存在。</h1>
      <p class="lede" style="margin-left:auto;margin-right:auto">它可能已经移动，或者链接写错了。回到介绍页继续了解 dsh-plugin-updater。</p>
      <div class="hero-actions" style="justify-content:center">
        <a class="button primary" href="./">返回首页</a>
        <a class="button" href="https://github.com/TT10-24/dsh-plugin-updater">GitHub</a>
      </div>
    </div>
  </main>
</body>
</html>
